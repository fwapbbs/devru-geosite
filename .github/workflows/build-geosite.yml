name: build geosite

# Пересобирает объединённый geosite.dat и публикует его двумя способами:
#   1. ветка release + тег -> раздача через jsdelivr (иммутабельный кеш по тегу)
#   2. GitHub Release с ассетами geosite.dat и link.txt
# runetfreedom обновляет свои списки каждые 6 часов.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Собрать geosite.dat
        run: python3 build_geosite.py -o dist/geosite.dat

      - name: Тег
        id: meta
        run: |
          echo "tag=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: Закоммитить в ветку release
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin release:release 2>/dev/null || git branch release
          git worktree add /tmp/release release
          mkdir -p /tmp/release/release
          cp dist/geosite.dat dist/geosite.dat.sha256 /tmp/release/release/
          git -C /tmp/release add release
          git -C /tmp/release commit -m "geosite $TAG" || echo "нечего коммитить"
          git -C /tmp/release tag "$TAG"
          git -C /tmp/release push origin release --tags

      - name: Сгенерировать happ-ссылку
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          URL="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${TAG}/release/geosite.dat"
          python3 make_link.py --geosite-url "$URL" --touch | head -1 > dist/link.txt
          {
            echo "Geosite: \`$URL\`"
            echo
            echo '```'
            cat dist/link.txt
            echo '```'
          } > dist/notes.md

      - name: Релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          body_path: dist/notes.md
          files: |
            dist/geosite.dat
            dist/geosite.dat.sha256
            dist/link.txt
