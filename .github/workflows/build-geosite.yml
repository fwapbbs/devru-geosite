name: build geosite

# Пересобирает объединённый geosite.dat и публикует его двумя способами:
#   1. ветка release + тег -> раздача через jsdelivr (иммутабельный кеш по тегу)
#   2. GitHub Release с ассетами geosite.dat и link.txt
# runetfreedom обновляет свои списки каждые 6 часов.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Собрать geosite.dat
        run: python3 build_geosite.py -o dist/geosite.dat

      - name: Тег
        id: meta
        run: |
          echo "tag=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: Сгенерировать ссылки и профили
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          # Happ: geosite прибит к тегу, ссылку с новым LastUpdated надо раздавать заново.
          JSDELIVR="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${TAG}/release/geosite.dat"
          python3 make_link.py --client happ --geosite-url "$JSDELIVR" --touch | head -1 > dist/link.txt

          # INCY: профиль лежит по постоянному URL и обновляется сам, поэтому внутри него
          # geosite тоже указывает на постоянный адрес последнего релиза.
          LATEST="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/geosite.dat"
          python3 make_link.py --client incy --geosite-url "$LATEST" --touch \
            --json-out dist/incy-profile.json | head -1 > dist/incy-link.txt

          PROFILE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/release/incy/profile.json"
          {
            echo "**Happ** — geosite: \`$JSDELIVR\`"
            echo
            echo '```'
            cat dist/link.txt
            echo '```'
            echo
            echo "**INCY** — автообновляемый профиль (ссылка постоянная, менять не нужно):"
            echo
            echo '```'
            echo "incy://autorouting/onadd/$PROFILE_URL"
            echo '```'
            echo
            echo "Разовый импорт для INCY — в ассете \`incy-link.txt\`."
          } > dist/notes.md

      - name: Закоммитить в ветку release
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin release:release 2>/dev/null || git branch release
          git worktree add /tmp/release release
          mkdir -p /tmp/release/release /tmp/release/incy
          cp dist/geosite.dat dist/geosite.dat.sha256 /tmp/release/release/
          cp dist/incy-profile.json /tmp/release/incy/profile.json
          git -C /tmp/release add release incy
          git -C /tmp/release commit -m "geosite $TAG" || echo "нечего коммитить"
          git -C /tmp/release tag "$TAG"
          git -C /tmp/release push origin release --tags

      - name: Релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          body_path: dist/notes.md
          files: |
            dist/geosite.dat
            dist/geosite.dat.sha256
            dist/link.txt
            dist/incy-link.txt
            dist/incy-profile.json
